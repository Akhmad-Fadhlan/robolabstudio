<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -8 20 28" width="300" height="420">
  <defs>
    <!-- Premium 3D Gradients -->
    <linearGradient id="bodyBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0.5" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <!-- Pattern for mesh vents -->
    <pattern id="ventPattern" x="0" y="0" width="2" height="2" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#022a40" opacity="0.8"/>
      <rect x="1" y="1" width="1" height="1" fill="#022a40" opacity="0.8"/>
    </pattern>
  </defs>

  <!-- Blue Plastic Body: x = -6 to x = 6 (width 12mm), y = -5 to y = 15 (height 20mm) -->
  <rect x="-6" y="-5" width="12" height="20" rx="1.2" fill="url(#bodyBlue)" stroke="#0284c7" stroke-width="0.3" filter="url(#dropShadow)"/>
  
  <!-- Outer highlight/bevel -->
  <rect x="-5.6" y="-4.6" width="11.2" height="19.2" rx="0.8" fill="none" stroke="#e0f2fe" stroke-width="0.25" opacity="0.35"/>

  <!-- Vents / Grille area (typically upper 2/3 of the sensor) -->
  <rect x="-4.5" y="-3" width="9" height="10" rx="0.5" fill="#083344" stroke="#0369a1" stroke-width="0.2"/>
  
  <!-- Vents / Grille mesh design -->
  <rect x="-4" y="-2.5" width="8" height="9" fill="url(#ventPattern)"/>
  
  <!-- Horizontal and vertical slots on the grille (typical DHT11 pattern) -->
  <line x1="-3" y1="-0.5" x2="3" y2="-0.5" stroke="#0284c7" stroke-width="0.3"/>
  <line x1="-3" y1="2.5" x2="3" y2="2.5" stroke="#0284c7" stroke-width="0.3"/>
  <line x1="-3" y1="5.5" x2="3" y2="5.5" stroke="#0284c7" stroke-width="0.3"/>
  
  <line x1="-1.5" y1="-2" x2="-1.5" y2="7" stroke="#0284c7" stroke-width="0.3"/>
  <line x1="1.5" y1="-2" x2="1.5" y2="7" stroke="#0284c7" stroke-width="0.3"/>

  <!-- Lower branding/text area -->
  <rect x="-4.5" y="8.5" width="9" height="5" rx="0.5" fill="#0369a1" opacity="0.4"/>
  <text x="0" y="11" font-family="Arial" font-size="2" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.2">DHT11</text>
  <text x="0" y="13" font-family="Arial" font-size="1" fill="#e0f2fe" text-anchor="middle" opacity="0.8">TEMP &amp; HUMID</text>

  <!-- Pins (Po: x=-3.81, -1.27, 1.27, 3.81 at y=15) -->
  <rect x="-4.11" y="15" width="0.6" height="7" rx="0.15" fill="url(#pinGrad)" filter="url(#dropShadow)"/>
  <rect x="-1.57" y="15" width="0.6" height="7" rx="0.15" fill="url(#pinGrad)" filter="url(#dropShadow)"/>
  <rect x="0.97" y="15" width="0.6" height="7" rx="0.15" fill="url(#pinGrad)" filter="url(#dropShadow)"/>
  <rect x="3.51" y="15" width="0.6" height="7" rx="0.15" fill="url(#pinGrad)" filter="url(#dropShadow)"/>

  <!-- Pin labels silkscreen -->
  <g font-family="monospace" font-size="1.1" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.8">
    <text x="-3.81" y="14.2">1</text>
    <text x="-1.27" y="14.2">2</text>
    <text x="1.27" y="14.2">3</text>
    <text x="3.81" y="14.2">4</text>
  </g>
</svg>
