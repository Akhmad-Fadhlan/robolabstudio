<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -8 22 30" width="300" height="400">
  <defs>
    <!-- Premium 3D Gradients -->
    <linearGradient id="metalBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="40%" stop-color="#94a3b8"/>
      <stop offset="85%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="brassCollar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a85f10"/>
      <stop offset="30%" stop-color="#eab308"/>
      <stop offset="60%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="metalShaft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="40%" stop-color="#f1f5f9"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="carbonTrack" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="85%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0.5" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Potentiometer Board/Base backing (x=-3.5 to x=13.5, y=-5.69 to y=3.81) -->
  <rect x="-3.5" y="-5.69" width="17" height="9.5" rx="1" fill="#1e3a2f" stroke="#14532d" stroke-width="0.3" filter="url(#dropShadow)"/>
  
  <!-- Carbon track circle visualization on base -->
  <circle cx="5" cy="-0.94" r="3.8" fill="url(#carbonTrack)" stroke="#ca8a04" stroke-width="0.2" opacity="0.8"/>

  <!-- Metal Mounting Bracket/Collar (y=3.81 to y=10.31, x=1.5 to x=8.5) -->
  <rect x="1.5" y="3.81" width="7" height="6.5" fill="url(#brassCollar)" stroke="#854d0e" stroke-width="0.2" filter="url(#dropShadow)"/>
  <!-- Threaded details on collar -->
  <line x1="1.5" y1="5" x2="8.5" y2="5" stroke="#713f12" stroke-width="0.4"/>
  <line x1="1.5" y1="6.5" x2="8.5" y2="6.5" stroke="#713f12" stroke-width="0.4"/>
  <line x1="1.5" y1="8" x2="8.5" y2="8" stroke="#713f12" stroke-width="0.4"/>

  <!-- Metal Shaft (y=10.31 to y=18.81, x=2 to x=8) -->
  <rect x="2" y="10.31" width="6" height="8.5" fill="url(#metalShaft)" stroke="#475569" stroke-width="0.25" filter="url(#dropShadow)"/>
  <!-- Flat notch on the shaft (standard for D-shaft pots) -->
  <rect x="3.8" y="10.31" width="2.4" height="8.5" fill="#334155" opacity="0.4"/>
  <!-- Chamfer top of shaft -->
  <line x1="2" y1="18.81" x2="8" y2="18.81" stroke="#cbd5e1" stroke-width="0.3"/>

  <!-- PCB Terminals (Pins) (x=0, x=5, x=10 at y=0) -->
  <!-- Pin 1 (Po 0 0, typically square pad/leads) -->
  <g id="pin1" filter="url(#dropShadow)">
    <rect x="-0.7" y="-5" width="1.4" height="5" rx="0.2" fill="url(#pinGrad)" stroke="#475569" stroke-width="0.15"/>
    <circle cx="0" cy="0" r="0.8" fill="#ca8a04" stroke="#9a3412" stroke-width="0.15"/>
    <circle cx="0" cy="0" r="0.4" fill="#0f172a"/>
  </g>
  
  <!-- Pin 2 (Po 5 0, center wiper) -->
  <g id="pin2" filter="url(#dropShadow)">
    <rect x="4.3" y="-5" width="1.4" height="5" rx="0.2" fill="url(#pinGrad)" stroke="#475569" stroke-width="0.15"/>
    <circle cx="5" cy="0" r="0.8" fill="#ca8a04" stroke="#9a3412" stroke-width="0.15"/>
    <circle cx="5" cy="0" r="0.4" fill="#0f172a"/>
  </g>
  
  <!-- Pin 3 (Po 10 0) -->
  <g id="pin3" filter="url(#dropShadow)">
    <rect x="9.3" y="-5" width="1.4" height="5" rx="0.2" fill="url(#pinGrad)" stroke="#475569" stroke-width="0.15"/>
    <circle cx="10" cy="0" r="0.8" fill="#ca8a04" stroke="#9a3412" stroke-width="0.15"/>
    <circle cx="10" cy="0" r="0.4" fill="#0f172a"/>
  </g>

  <!-- Labels on board -->
  <g font-family="Arial" font-size="1.2" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.8">
    <text x="0" y="-3.5">1</text>
    <text x="5" y="-3.5">2</text>
    <text x="10" y="-3.5">3</text>
  </g>
</svg>
