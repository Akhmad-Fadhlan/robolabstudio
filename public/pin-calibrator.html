<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pin Calibrator</title>
<style>
  body { background: #111; color: #fff; font-family: monospace; margin: 0; padding: 10px; }
  h2 { margin: 5px 0; font-size: 14px; }
  .controls { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  select, button, input { background: #222; color: #fff; border: 1px solid #444; padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 12px; }
  button { cursor: pointer; }
  button:hover { background: #333; }
  .canvas-container { position: relative; display: inline-block; border: 1px solid #444; background: #0a0a0f; }
  .canvas-container img { display: block; }
  .overlay { position: absolute; top: 0; left: 0; pointer-events: none; }
  .overlay svg { overflow: visible; }
  .dot { cursor: crosshair; pointer-events: all; }
  #log { background: #0d1117; border: 1px solid #30363d; padding: 8px; margin-top: 8px; max-height: 200px; overflow-y: auto; font-size: 11px; white-space: pre; }
  .pin-info { font-size: 11px; color: #58a6ff; }
  #coordinates { background: #161b22; padding: 6px; font-size: 11px; margin-top: 4px; border-radius: 4px; }
</style>
</head>
<body>
<h2>🎯 Pin Calibrator — Click anywhere on the board to get SVG coordinates</h2>
<div class="controls">
  <label>Board:</label>
  <select id="boardSelect">
    <option value="esp32">ESP32 DevKitC V4</option>
    <option value="esp8266">NodeMCU ESP8266</option>
    <option value="arduino">Arduino Uno</option>
  </select>
  <label>Display Width:</label>
  <input type="number" id="imgWidth" value="170" min="50" max="500" step="10">
  <label>Display Height:</label>
  <input type="number" id="imgHeight" value="345" min="50" max="800" step="10">
  <button onclick="applySize()">Apply</button>
  <button onclick="clearDots()">Clear Dots</button>
  <button onclick="copyCoords()">Copy All Coords</button>
</div>

<div class="controls">
  <label>Rotation:</label>
  <select id="rotSelect">
    <option value="0">0° (normal)</option>
    <option value="90" selected>90° CW</option>
    <option value="-90">90° CCW</option>
    <option value="180">180°</option>
  </select>
  <button onclick="applySize()">Apply</button>
</div>

<div id="canvas-wrap" class="canvas-container" style="width:170px; height:345px; overflow:hidden;">
  <div id="rotated-wrap" style="position:absolute; top:0; left:0; transform-origin: top left;">
    <img id="board-img" src="/1666364456Esp32_devkitc_v4.svg" style="width:345px; height:170px; display:block;">
  </div>
  <svg id="overlay-svg" class="overlay" style="width:170px; height:345px;" onclick="onSVGClick(event)">
    <g id="dots-layer"></g>
    <circle id="cursor-dot" r="4" fill="rgba(255,100,0,0.5)" stroke="#ff6400" stroke-width="1" cx="-100" cy="-100" style="pointer-events:none;" />
    <text id="coord-label" x="-100" y="-100" fill="#ff6400" font-size="10" font-family="monospace" style="pointer-events:none;"></text>
  </svg>
</div>

<div id="coordinates">Hover over board to see coordinates. Click to mark a pin.</div>

<div id="log">Click on each pin hole to record coordinates. They will appear here.

</div>

<script>
let dots = [];
let pinCount = 0;
let imgDisplayW = 170, imgDisplayH = 345;
let rotation = 90;

const boards = {
  esp32: { src: '/1666364456Esp32_devkitc_v4.svg', naturalW: 345, naturalH: 170 },
  esp8266: { src: '/esp8266.png', naturalW: 100, naturalH: 189 },
  arduino: { src: '/Arduino-Fixed.svg', naturalW: 250, naturalH: 177.3 }
};

function applySize() {
  imgDisplayW = parseInt(document.getElementById('imgWidth').value);
  imgDisplayH = parseInt(document.getElementById('imgHeight').value);
  rotation = parseInt(document.getElementById('rotSelect').value);
  
  const board = document.getElementById('boardSelect').value;
  const info = boards[board];
  
  document.getElementById('board-img').src = info.src;
  
  const wrap = document.getElementById('canvas-wrap');
  const rotWrap = document.getElementById('rotated-wrap');
  const img = document.getElementById('board-img');
  const overlaySvg = document.getElementById('overlay-svg');
  
  if (rotation === 90) {
    // CW 90: container is W x H, image is H x W rotated
    wrap.style.width = imgDisplayW + 'px';
    wrap.style.height = imgDisplayH + 'px';
    img.style.width = imgDisplayH + 'px';
    img.style.height = imgDisplayW + 'px';
    rotWrap.style.transform = `translate(${imgDisplayW}px, 0px) rotate(90deg)`;
    rotWrap.style.transformOrigin = 'top left';
  } else if (rotation === -90) {
    wrap.style.width = imgDisplayW + 'px';
    wrap.style.height = imgDisplayH + 'px';
    img.style.width = imgDisplayH + 'px';
    img.style.height = imgDisplayW + 'px';
    rotWrap.style.transform = `translate(0px, ${imgDisplayH}px) rotate(-90deg)`;
    rotWrap.style.transformOrigin = 'top left';
  } else if (rotation === 180) {
    wrap.style.width = imgDisplayW + 'px';
    wrap.style.height = imgDisplayH + 'px';
    img.style.width = imgDisplayW + 'px';
    img.style.height = imgDisplayH + 'px';
    rotWrap.style.transform = `translate(${imgDisplayW}px, ${imgDisplayH}px) rotate(180deg)`;
    rotWrap.style.transformOrigin = 'top left';
  } else {
    wrap.style.width = imgDisplayW + 'px';
    wrap.style.height = imgDisplayH + 'px';
    img.style.width = imgDisplayW + 'px';
    img.style.height = imgDisplayH + 'px';
    rotWrap.style.transform = '';
  }
  
  overlaySvg.setAttribute('width', imgDisplayW);
  overlaySvg.setAttribute('height', imgDisplayH);
  overlaySvg.style.width = imgDisplayW + 'px';
  overlaySvg.style.height = imgDisplayH + 'px';
}

function onSVGClick(e) {
  const svg = document.getElementById('overlay-svg');
  const rect = svg.getBoundingClientRect();
  const x = parseFloat((e.clientX - rect.left).toFixed(1));
  const y = parseFloat((e.clientY - rect.top).toFixed(1));
  
  pinCount++;
  const id = 'p' + pinCount;
  dots.push({ id, x, y });
  
  const dotsLayer = document.getElementById('dots-layer');
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  
  const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  circle.setAttribute('cx', x);
  circle.setAttribute('cy', y);
  circle.setAttribute('r', '5');
  circle.setAttribute('fill', 'rgba(0,200,255,0.4)');
  circle.setAttribute('stroke', '#00c8ff');
  circle.setAttribute('stroke-width', '1.5');
  
  const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  text.setAttribute('x', x + 7);
  text.setAttribute('y', y + 4);
  text.setAttribute('fill', '#00c8ff');
  text.setAttribute('font-size', '9');
  text.setAttribute('font-family', 'monospace');
  text.textContent = `#${pinCount} (${x},${y})`;
  
  g.appendChild(circle);
  g.appendChild(text);
  g.setAttribute('id', id);
  dotsLayer.appendChild(g);
  
  const log = document.getElementById('log');
  log.textContent += `Pin #${pinCount}: cx=${x}, cy=${y}\n`;
  log.scrollTop = log.scrollHeight;
}

document.getElementById('overlay-svg').addEventListener('mousemove', function(e) {
  const rect = this.getBoundingClientRect();
  const x = parseFloat((e.clientX - rect.left).toFixed(1));
  const y = parseFloat((e.clientY - rect.top).toFixed(1));
  
  document.getElementById('cursor-dot').setAttribute('cx', x);
  document.getElementById('cursor-dot').setAttribute('cy', y);
  document.getElementById('coord-label').setAttribute('x', x + 6);
  document.getElementById('coord-label').setAttribute('y', y - 3);
  document.getElementById('coord-label').textContent = `${x},${y}`;
  document.getElementById('coordinates').textContent = `Cursor: x=${x}, y=${y} | Image Size: ${imgDisplayW}x${imgDisplayH} | Rotation: ${rotation}°`;
});

function clearDots() {
  document.getElementById('dots-layer').innerHTML = '';
  dots = [];
  pinCount = 0;
  document.getElementById('log').textContent = 'Cleared.\n\n';
}

function copyCoords() {
  const text = dots.map((d,i) => `Pin ${i+1}: { cx: bx + ${d.x}, cy: by + ${d.y} }`).join('\n');
  navigator.clipboard.writeText(text).then(() => alert('Coordinates copied!'));
}

applySize();
</script>
</body>
</html>
