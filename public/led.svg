<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -10 30 50" width="300" height="500">
  <defs>
    <!-- Premium 3D Gradients -->
    <linearGradient id="anodeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b0b0b0"/>
      <stop offset="50%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#8c8c8c"/>
    </linearGradient>
    <linearGradient id="cathodeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a0a0a0"/>
      <stop offset="50%" stop-color="#d8d8d8"/>
      <stop offset="100%" stop-color="#7c7c7c"/>
    </linearGradient>
    <radialGradient id="ledGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#ff6666" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#cc0000" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7f0000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ledBody" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff9999"/>
      <stop offset="40%" stop-color="#e60000"/>
      <stop offset="85%" stop-color="#800000"/>
      <stop offset="100%" stop-color="#4a0000"/>
    </radialGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#990000"/>
      <stop offset="50%" stop-color="#e60000"/>
      <stop offset="100%" stop-color="#660000"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0.5" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ground / Shadow -->
  <ellipse cx="0" cy="35" rx="8" ry="1.5" fill="#000000" opacity="0.2" filter="url(#dropShadow)"/>

  <!-- Metal Leads (Pins) -->
  <!-- Anode (Longer pin: Po 1.27 0) -->
  <rect x="1.0" y="3.5" width="0.54" height="28.0" rx="0.1" fill="url(#anodeGrad)"/>
  <!-- Cathode (Shorter pin: Po -1.27 0) -->
  <rect x="-1.54" y="3.5" width="0.54" height="22.0" rx="0.1" fill="url(#cathodeGrad)"/>

  <!-- Led Internal Structure (Anode/Cathode Frame visible inside epoxy) -->
  <!-- Anode Post (thin wire inside) -->
  <path d="M 1.27,3.5 L 1.27,-2 L 0.5,-4" fill="none" stroke="#b0b0b0" stroke-width="0.3" opacity="0.7"/>
  <!-- Cathode Anvil (wider reflective cup inside) -->
  <path d="M -1.27,3.5 L -1.27,-1 L -0.5,-1 L -0.2,-3 L -1.2,-3 Z" fill="#909090" opacity="0.8"/>
  <!-- Gold bonding wire connecting anode to cathode cup -->
  <path d="M 0.5,-4 Q 0,-6.5 -0.3,-3" fill="none" stroke="#d4af37" stroke-width="0.15" opacity="0.8"/>

  <!-- LED Epoxy Body (Standard 5mm dome = radius 2.5mm, rim = radius 2.95mm) -->
  <!-- Base Rim (Flange) - y=3.0 to y=4.5. Width = 5.9mm (radius 2.95) -->
  <path d="M -2.95,3 A 0.5,0.5 0 0,1 -2.5,2.5 L 2.5,2.5 A 0.5,0.5 0 0,1 2.95,3 L 2.95,4 A 0.5,0.5 0 0,1 2.5,4.5 L -2.773,4.5 A 0.2,0.2 0 0,1 -2.95,4.3 Z" fill="url(#rimGrad)" filter="url(#dropShadow)"/>
  
  <!-- LED Dome (Cylinder + Hemisphere) -->
  <!-- Cylinder part: from y=-3.5 to y=2.5, width 5.0mm (radius 2.5) -->
  <rect x="-2.5" y="-3.5" width="5" height="6.1" fill="url(#ledBody)" opacity="0.95"/>
  <!-- Dome part: centered at y=-3.5, radius 2.5 -->
  <path d="M -2.5,-3.5 A 2.5,2.5 0 0,1 2.5,-3.5 Z" fill="url(#ledBody)" opacity="0.95"/>

  <!-- Glow effect (when turned on, can be overlaid/styled) -->
  <circle cx="0" cy="-3.5" r="8" fill="url(#ledGlow)" opacity="0.75" style="mix-blend-mode: screen; pointer-events: none;"/>

  <!-- Lens reflection highlight -->
  <path d="M -1.8,-3.5 A 1.8,1.8 0 0,1 0.5,-5.5 A 0.5,0.5 0 0,0 -1.2,-4.5 Z" fill="#ffffff" opacity="0.35"/>
  <ellipse cx="1.2" cy="-1.5" rx="0.4" ry="1.2" fill="#ffffff" opacity="0.15" transform="rotate(-30, 1.2, -1.5)"/>
</svg>
