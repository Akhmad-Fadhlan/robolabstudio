<svg xmlns="http://www.w3.org/2000/svg" viewBox="-25 -5 50 30" width="500" height="300">
  <defs>
    <!-- Premium 3D Gradients -->
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="metalCylinder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="25%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="75%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <radialGradient id="meshGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d905"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0.5" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Board Outline: x=-22.5 to x=22.5, y=4.27 to y=19.27 -->
  <rect x="-22.5" y="4.27" width="45" height="15" rx="1.5" fill="url(#boardGrad)" stroke="#1d4ed8" stroke-width="0.3" filter="url(#dropShadow)"/>

  <!-- Silkscreen Text / Details on Board -->
  <text x="0" y="7" font-family="Arial" font-size="2" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.9">HC-SR04</text>
  <text x="-13.5" y="6" font-family="Arial" font-size="1.2" fill="#ffffff" text-anchor="middle" opacity="0.6">T</text>
  <text x="13.5" y="6" font-family="Arial" font-size="1.2" fill="#ffffff" text-anchor="middle" opacity="0.6">R</text>

  <!-- Copper traces on PCB (visual style) -->
  <path d="M -15,10 L -5,10 L -3.81,5.5 M 15,10 L 5,10 L 3.81,5.5" fill="none" stroke="#ca8a04" stroke-width="0.15" opacity="0.6"/>
  <path d="M -1.27,5.5 L -1.27,8 L -8,12" fill="none" stroke="#ca8a04" stroke-width="0.15" opacity="0.4"/>
  <path d="M 1.27,5.5 L 1.27,8 L 8,12" fill="none" stroke="#ca8a04" stroke-width="0.15" opacity="0.4"/>

  <!-- Mounting holes (usually 4 small holes in corners) -->
  <circle cx="-21" cy="5.5" r="0.8" fill="#0d1b3e" stroke="#ca8a04" stroke-width="0.15"/>
  <circle cx="21" cy="5.5" r="0.8" fill="#0d1b3e" stroke="#ca8a04" stroke-width="0.15"/>
  <circle cx="-21" cy="18" r="0.8" fill="#0d1b3e" stroke="#ca8a04" stroke-width="0.15"/>
  <circle cx="21" cy="18" r="0.8" fill="#0d1b3e" stroke="#ca8a04" stroke-width="0.15"/>

  <!-- Header pin block (centered at x=0, y=4.27 to y=-1.25) -->
  <rect x="-5" y="-1.25" width="10" height="5.5" rx="0.5" fill="#1e293b" stroke="#0f172a" stroke-width="0.2"/>

  <!-- Pins (Po: x=-3.81, -1.27, 1.27, 3.81 at y=0) -->
  <!-- We draw them extending down from the connector block -->
  <rect x="-4.21" y="-4" width="0.8" height="6" rx="0.1" fill="url(#pinGrad)" filter="url(#dropShadow)"/>
  <rect x="-1.67" y="-4" width="0.8" height="6" rx="0.1" fill="url(#pinGrad)" filter="url(#dropShadow)"/>
  <rect x="0.87" y="-4" width="0.8" height="6" rx="0.1" fill="url(#pinGrad)" filter="url(#dropShadow)"/>
  <rect x="3.41" y="-4" width="0.8" height="6" rx="0.1" fill="url(#pinGrad)" filter="url(#dropShadow)"/>

  <!-- Pin labels silkscreen -->
  <g font-family="monospace" font-size="1.1" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.8">
    <text x="-3.81" y="3.5">VCC</text>
    <text x="-1.27" y="3.5">TRIG</text>
    <text x="1.27" y="3.5">ECHO</text>
    <text x="3.81" y="3.5">GND</text>
  </g>

  <!-- Left Transducer Cylinder (centered at x=-13.5, y=11.77, r=8) -->
  <g id="transducer_t" filter="url(#dropShadow)">
    <circle cx="-13.5" cy="11.77" r="8" fill="url(#metalCylinder)" stroke="#64748b" stroke-width="0.3"/>
    <!-- Outer rim highlight -->
    <circle cx="-13.5" cy="11.77" r="7.5" fill="none" stroke="#ffffff" stroke-width="0.2" opacity="0.5"/>
    <!-- Inner mesh area -->
    <circle cx="-13.5" cy="11.77" r="6.8" fill="url(#meshGrad)"/>
    <!-- Mesh pattern overlay (simulated) -->
    <circle cx="-13.5" cy="11.77" r="6.8" fill="none" stroke="#475569" stroke-width="0.3" stroke-dasharray="1.5,1"/>
    <!-- Central T text -->
    <text x="-13.5" y="13.27" font-family="Arial" font-size="4" font-weight="bold" fill="#cbd5e1" text-anchor="middle" opacity="0.9">T</text>
  </g>

  <!-- Right Transducer Cylinder (centered at x=13.5, y=11.77, r=8) -->
  <g id="transducer_r" filter="url(#dropShadow)">
    <circle cx="13.5" cy="11.77" r="8" fill="url(#metalCylinder)" stroke="#64748b" stroke-width="0.3"/>
    <circle cx="13.5" cy="11.77" r="7.5" fill="none" stroke="#ffffff" stroke-width="0.2" opacity="0.5"/>
    <circle cx="13.5" cy="11.77" r="6.8" fill="url(#meshGrad)"/>
    <circle cx="13.5" cy="11.77" r="6.8" fill="none" stroke="#475569" stroke-width="0.3" stroke-dasharray="1.5,1"/>
    <text x="13.5" y="13.27" font-family="Arial" font-size="4" font-weight="bold" fill="#cbd5e1" text-anchor="middle" opacity="0.9">R</text>
  </g>

</svg>
